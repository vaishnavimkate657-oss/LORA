# ==========================================================
# Render Blueprint Specification for TripPartner Full-Stack
# Documentation: https://render.com/docs/blueprint-spec
# ==========================================================

databases:
  - name: trippartner-db
    databaseName: trippartner
    user: trippartner_user
    plan: free
    region: oregon

services:
  # --------------------------------------------------------
  # Backend Web Service (Spring Boot 3 + PostgreSQL)
  # --------------------------------------------------------
  - type: web
    name: trippartner-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/destinations/trending
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: trippartner-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://trippartner-frontend.onrender.com
      - key: APP_JWT_SECRET
        generateValue: true

  # --------------------------------------------------------
  # Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # --------------------------------------------------------
  - type: web
    name: trippartner-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: trippartner-backend
          property: host
    routes:
      # Single-Page Application (SPA) catch-all rewrite to prevent 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html
