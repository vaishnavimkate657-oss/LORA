# ==========================================================
# TripPartner Backend - PostgreSQL Cloud Profile (Render)
# Active when SPRING_PROFILES_ACTIVE=postgres
# ==========================================================

# PostgreSQL Datasource Defaults (overridden dynamically by DatabaseConfig.java if DATABASE_URL is present)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trippartner}?sslmode=prefer
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate / JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable MSSQL Flyway migration on PostgreSQL profile
spring.flyway.enabled=false
