# Spring Boot Server Configuration - Dynamic Render Port
server.port=${PORT:8080}

# Active Profile Configuration (defaults to local development)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Microsoft SQL Server Datasource Configuration (Local Default)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=trippartner_db;encrypt=true;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword#123

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration (MSSQL Local)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET:9a6747f3b6488d559f808edd1463256ee60fee00944863d4e42c694f223035cb1dd320cad802f4f53343a9d040e45fc90293dac7acbe3776b66f47c0b41384e0}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
